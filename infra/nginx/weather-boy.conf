# Production 예제 (Ubuntu + Let's Encrypt). example.com 을 실제 도메인으로 바꾼다.
# 한 도메인에서 Frontend(정적) + /api 를 함께 서비스하면 Session Cookie(SameSite=Lax)가 그대로 동작한다.
server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Frontend (vite build 결과: frontend/dist)
    root /var/www/weather-boy;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # secure cookie 판단에 필수 (Express 'trust proxy' 와 짝)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health { proxy_pass http://127.0.0.1:4000; }
    location = /ready  { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:4000; }
}
