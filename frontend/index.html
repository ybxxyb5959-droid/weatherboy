<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfcfa" />
    <!-- 폰이 다크모드여도 이 앱은 항상 밝은 종이 배경: 브라우저의 자동 다크(색 반전)를 끈다.
         삼성 인터넷은 "only light" 의 only 를 못 읽고 강제로 뒤집는 것으로 보여, 메타는 단순한 "light" 로 둔다(CSS 쪽은 only light 유지). -->
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="description" content="날씨와 내 옷장으로 오늘 입을 옷을 골라 주는 앱" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="뭐입을옷?" />
    <meta property="og:description" content="날씨와 내 옷장으로 오늘 입을 옷을 골라 주는 앱" />
    <meta property="og:image" content="https://weatherboy-weld.vercel.app/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="뭐입을옷?" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Poor+Story&display=swap" rel="stylesheet" />
    <title>뭐입을옷?</title>
    <style>
      /* 앱 코드가 열리기 전에 잠깐 보이는 로딩 화면(앱이 열리면 #root 가 통째로 바뀐다) */
      .boot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 100vh; min-height: 100dvh; background: #fcfcfa; color: #222; font-family: Gaegu, 'Nanum Pen Script', cursive; }
      .boot b { font-size: 40px; }
      .boot span { font-size: 18px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <svg width="90" height="120" viewBox="0 0 90 120" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" aria-hidden="true">
          <circle cx="45" cy="22" r="16" />
          <path d="M45 38 V80 M45 50 L22 68 M45 50 L68 68 M45 80 L28 112 M45 80 L62 112" />
        </svg>
        <b>뭐입을옷?</b>
        <span>불러오는 중…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
